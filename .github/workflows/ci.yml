name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # core-api imports the built packages, so these must exist before
      # typecheck runs.
      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Integration tests need a real Postgres. They run only when the
      # TEST_DATABASE_URL secret is configured — point it at a throwaway
      # database (a Neon branch works well), never production: the suite
      # writes and deletes rows.
      - name: Integration tests
        working-directory: services/core-api
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "TEST_DATABASE_URL not configured — skipping integration tests."
            exit 0
          fi
          pnpm test:integration

      # Catches a schema edit that was committed without regenerating the
      # migration — the drift only shows up at deploy time otherwise.
      - name: Check migrations are up to date
        working-directory: services/core-api
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: |
          pnpm exec drizzle-kit generate --name ci-drift-check
          if ! git diff --quiet -- drizzle/; then
            echo "::error::Schema changed without a matching migration. Run 'pnpm db:generate' and commit the result."
            git diff --stat -- drizzle/
            exit 1
          fi

  # Every step is a literal command from the README. The `node` job runs with a
  # warm workspace and has stayed green while the fresh-clone path was broken.
  fresh-clone:
    name: fresh clone · setup · boot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # compose, not a `services:` container — this must exercise
      # infra/init-databases.sh, which creates the second database.
      - name: pnpm infra:up
        run: pnpm infra:up

      - name: Wait for Postgres to report healthy
        run: |
          for _ in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nyanoghar-postgres-1 2>/dev/null || echo missing)
            if [ "$status" = healthy ]; then echo "postgres healthy"; exit 0; fi
            sleep 3
          done
          echo "::error::Postgres never became healthy"
          docker logs nyanoghar-postgres-1 2>&1 | tail -40
          exit 1

      - name: Both databases exist, with their extensions
        run: |
          set -euo pipefail
          for db in nyanoghar chat; do
            docker exec nyanoghar-postgres-1 psql -U nyanoghar -d "$db" -tAc 'select 1' >/dev/null
            for ext in postgis pg_trgm; do
              found=$(docker exec nyanoghar-postgres-1 psql -U nyanoghar -d "$db" -tAc \
                "select 1 from pg_extension where extname = '$ext'")
              [ "$found" = "1" ] || { echo "::error::$ext missing from $db"; exit 1; }
            done
            echo "$db ok"
          done

      - name: Install
        run: pnpm install --frozen-lockfile

      # Never set DATABASE_URL below — the point is that the root .env is
      # found from a package subdirectory.
      - name: cp .env.example .env
        run: cp .env.example .env

      - name: pnpm setup
        run: pnpm setup

      - name: Reference data was seeded
        run: |
          count=$(docker exec nyanoghar-postgres-1 psql -U nyanoghar -d nyanoghar -tAc \
            'select count(*) from catalog.species')
          [ "$count" -gt 0 ] || { echo "::error::no species seeded"; exit 1; }
          echo "seeded $count species"

      - name: Seeding is idempotent
        run: |
          before=$(docker exec nyanoghar-postgres-1 psql -U nyanoghar -d nyanoghar -tAc \
            'select count(*) from catalog.breeds')
          pnpm db:seed
          after=$(docker exec nyanoghar-postgres-1 psql -U nyanoghar -d nyanoghar -tAc \
            'select count(*) from catalog.breeds')
          [ "$before" = "$after" ] || { echo "::error::rerunning db:seed changed breeds $before -> $after"; exit 1; }
          echo "breeds stable at $after"

      - name: pnpm dev serves the documented endpoints
        run: |
          set -euo pipefail
          pnpm dev > dev.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:4000/health >/dev/null 2>&1; then break; fi
            sleep 3
          done

          curl -fsS http://localhost:4000/health | tee /dev/stderr | grep -q '"status":"ok"'

          species=$(curl -fsS http://localhost:4000/api/v1/reference/species \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).length))")
          [ "$species" -gt 0 ] || { echo "::error::/reference/species returned none"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:4000/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"fullName":"CI User","email":"ci@example.test","password":"Correct1Horse","acceptedTermsVersion":"1.0"}')
          [ "$code" = 201 ] || { echo "::error::register returned $code, expected 201"; exit 1; }

          grep -q 'no S3 credentials configured' dev.log \
            || { echo "::error::expected the media stub warning"; exit 1; }

          echo "fresh clone is usable"

      - name: Server logs
        if: failure()
        run: tail -60 dev.log || true

      - name: Postgres logs
        if: failure()
        run: docker logs nyanoghar-postgres-1 2>&1 | tail -60 || true

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  go:
    name: chat-svc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/chat-svc/go.sum

      - name: Build
        working-directory: services/chat-svc
        run: go build ./...

      - name: Vet
        working-directory: services/chat-svc
        run: go vet ./...

      - name: Test
        working-directory: services/chat-svc
        run: go test ./...
