name: nyanoghar

# Two databases (see CLAUDE.md): `nyanoghar` holds the core API's four module
# schemas; `chat` belongs to the Go service alone. They share one Postgres
# container in development — in production they are separate instances.

x-node-service: &node-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [nyanoghar]

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_ISSUER: ${JWT_ISSUER:-nyanoghar}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-nyanoghar-clients}

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyanoghar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Creates the two databases on first boot. Per-service schemas inside
      # `nyanoghar` are created by each service's own migration.
      POSTGRES_MULTIPLE_DATABASES: nyanoghar,chat
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyanoghar}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nyanoghar]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nyanoghar]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    networks: [nyanoghar]

  core-api:
    <<: *node-service
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    environment:
      <<: *common-env
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-nyanoghar}:${POSTGRES_PASSWORD}@postgres:5432/nyanoghar
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_URL: http://chat-svc:8080
      CHAT_SERVICE_WS_URL: ws://chat-svc:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  chat-svc:
    build:
      context: ../services/chat-svc
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://${POSTGRES_USER:-nyanoghar}:${POSTGRES_PASSWORD}@postgres:5432/chat
      NATS_URL: nats://nats:4222
    # Deliberately not published to the host: core-api verifies the JWT at the
    # edge and forwards a trusted identity header, which is only safe on the
    # internal network. Exposing 8080 directly would let anyone forge
    # X-User-Id.
    expose:
      - "8080"
      - "50051"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [nyanoghar]

volumes:
  postgres-data:
  redis-data:

networks:
  nyanoghar:
    driver: bridge
