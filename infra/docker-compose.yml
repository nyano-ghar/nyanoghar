name: nyanoghar

# Two databases (see CLAUDE.md): `nyanoghar` holds the core API's four module
# schemas; `chat` belongs to the Go service alone. They share one Postgres
# container in development — in production they are separate instances.
#
# This file is for LOCAL DEVELOPMENT ONLY. Every credential below falls back to
# a well-known development default so a fresh clone runs with no .env at all.
# That is a deliberate trade: these values are public knowledge, and this stack
# binds to localhost. Do not deploy this file. For anything reachable from a
# network, supply real secrets via the environment — see CONTRIBUTING.md.

x-node-service: &node-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [nyanoghar]

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Dev-only fallback: 48 bytes, meets the >=32 char rule, and is intentionally
  # not a secret. Override it anywhere that matters.
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-insecure-secret-do-not-use-in-production-0123456789}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_ISSUER: ${JWT_ISSUER:-nyanoghar}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-nyanoghar-clients}

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyanoghar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyanoghar}
      # Creates the two databases on first boot. Per-service schemas inside
      # `nyanoghar` are created by each service's own migration.
      POSTGRES_MULTIPLE_DATABASES: nyanoghar,chat
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyanoghar}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nyanoghar]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nyanoghar]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    networks: [nyanoghar]

  # S3-compatible storage for local media development. S3 is a protocol, so
  # the same code path that talks to AWS in production talks to this in
  # development — no AWS account needed to work on uploads.
  # Start with `pnpm infra:up:media`. Console at http://localhost:9001.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY_ID:-nyanoghar-local-key}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_ACCESS_KEY:-nyanoghar-local-secret-000000000000}
      # Presigned PUTs sign `x-amz-server-side-encryption: AES256`, and MinIO
      # rejects SSE outright unless a KMS key exists — every upload would 501.
      # This built-in key makes encryption-at-rest work locally exactly as S3
      # does, so the dev path exercises the real header rather than a weakened
      # one. Dev-only, like every other credential in this file.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-nyanoghar-local-key:bnlhbm9naGFyLWxvY2FsLWttcy1rZXktMDAwMDAwMDA=}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nyanoghar]

  # Creates the two buckets and makes the public one readable, then exits.
  # Mirrors the production layout: public objects are world-readable (behind
  # CloudFront in prod), private ones are reachable only via signed URLs.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-nyanoghar-local-key}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-nyanoghar-local-secret-000000000000}
      MEDIA_PUBLIC_BUCKET: ${MEDIA_PUBLIC_BUCKET:-nyanoghar-media}
      MEDIA_PRIVATE_BUCKET: ${MEDIA_PRIVATE_BUCKET:-nyanoghar-media-private}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MEDIA_S3_ACCESS_KEY_ID\" \"$$MEDIA_S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing \"local/$$MEDIA_PUBLIC_BUCKET\" &&
      mc mb --ignore-existing \"local/$$MEDIA_PRIVATE_BUCKET\" &&
      mc anonymous set download \"local/$$MEDIA_PUBLIC_BUCKET\" &&
      mc anonymous set none \"local/$$MEDIA_PRIVATE_BUCKET\" &&
      echo 'minio buckets ready'
      "
    networks: [nyanoghar]

  core-api:
    <<: *node-service
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    environment:
      <<: *common-env
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-nyanoghar}:${POSTGRES_PASSWORD:-nyanoghar}@postgres:5432/nyanoghar
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_URL: http://chat-svc:8080
      CHAT_SERVICE_WS_URL: ws://chat-svc:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  chat-svc:
    build:
      context: ../services/chat-svc
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://${POSTGRES_USER:-nyanoghar}:${POSTGRES_PASSWORD:-nyanoghar}@postgres:5432/chat
      NATS_URL: nats://nats:4222
    # Deliberately not published to the host: core-api verifies the JWT at the
    # edge and forwards a trusted identity header, which is only safe on the
    # internal network. Exposing 8080 directly would let anyone forge
    # X-User-Id.
    expose:
      - "8080"
      - "50051"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [nyanoghar]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  nyanoghar:
    driver: bridge
