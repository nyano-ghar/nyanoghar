version: v2
managed:
  enabled: true
plugins:
  # Go server stubs, consumed by services/chat-svc.
  - remote: buf.build/protocolbuffers/go
    out: ../../../services/chat-svc/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../../../services/chat-svc/gen
    opt: paths=source_relative,require_unimplemented_servers=false
  # TypeScript client, consumed by the gateway and Fastify services.
  - remote: buf.build/bufbuild/es
    out: ../src/proto/gen
    opt: target=ts
